<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pregnancy App</title>
  <script type="text/javascript">
    // Redirect to main app for hash routing
    // This handles direct access to routes in GitHub Pages
    var l = window.location;
    var basePath = '/pregnancy-app/';
    var currentPath = l.pathname;
    
    // If accessing a route directly (not the base path), redirect to base with hash
    if (currentPath !== basePath && currentPath.startsWith(basePath)) {
      var route = currentPath.replace(basePath, '');
      if (route) {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath + '#' + route);
      } else {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath);
      }
    } else if (currentPath === basePath) {
      // If accessing base path, just redirect to it (this will load the app)
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath);
    }
  </script>
</head>
<body>
  <p>Redirecting to Pregnancy App...</p>
</body>
</html>
